<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GestStock — Gestion de stock</title>
    <meta
      name="description"
      content="GestStock : application de gestion de stock — produits, mouvements, catégories, fournisseurs, alertes et rapports."
    />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="sidebar-head">
          <a class="brand" href="#/tableau-de-bord" aria-label="GestStock, accueil">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
                <path d="M3 8l9 5 9-5" />
                <path d="M12 13v8" />
              </svg>
            </span>
            <span class="brand-text">
              <strong>GestStock</strong>
              <small>Gestion d’inventaire</small>
            </span>
          </a>
          <button class="icon-btn sidebar-close" id="btn-close-sidebar" type="button" aria-label="Fermer le menu"></button>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>
      <div class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="btn-menu" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false"></button>
          <div class="topbar-heading">
            <h1 class="page-title" id="page-title">Tableau de bord</h1>
            <p class="page-subtitle" id="page-subtitle"></p>
          </div>
          <div class="topbar-actions">
            <span class="date-chip" id="date-chip"></span>
            <button class="btn btn-primary" id="btn-new-movement" type="button" aria-label="Nouveau mouvement de stock"></button>
            <button class="icon-btn" id="btn-theme" type="button" aria-label="Changer de thème"></button>
          </div>
        </header>
        <main class="content" id="app" tabindex="-1"></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
    <noscript>
      <div class="noscript">GestStock a besoin de JavaScript pour fonctionner. Activez-le puis rechargez la page.</div>
    </noscript>
  </body>
</html>
